<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080d16" />
    <title>Glassbook is offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #080d16;
        color: #f5f7fa;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(28rem, calc(100% - 3rem));
        text-align: center;
      }

      img {
        width: 5rem;
        height: 5rem;
      }

      h1 {
        margin: 1.5rem 0 0.5rem;
        font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
        font-size: 1.85rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: #aab5c5;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.7rem 1.1rem;
        border: 1px solid #dc5839;
        border-radius: 3px;
        background: #dc5839;
        color: #fffaf3;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/glassbook-mark.svg" alt="" width="80" height="80" />
      <h1>Glassbook is offline</h1>
      <p>Your private catalogue stays on the server. Reconnect to view or edit it.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
