<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080d16" />
    <meta name="application-name" content="Glassbook" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Glassbook" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/brand/glassbook-mark.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script nonce="%sveltekit.nonce%">
      (function () {
        try {
          var match = document.cookie.match(/(?:^|;\s*)theme=(light|dark)(?:;|$)/);
          var theme = match && match[1];
          if (!theme) {
            var t = localStorage.getItem('theme');
            if (t === 'light' || t === 'dark') theme = t;
          }
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;
          }
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
